app:
  # Identifiable User-Agent, as a matter of courtesy to INCOIS. Update the URL
  # once the repo is published.
  user_agent: "Meenvazhi/1.0 (+https://github.com/TonyGregg/meenvazhi)"
  timeout_seconds: 30
  retries: 3
  # Deliberately slower than bloom's 1.0s default. We run once a day and have
  # all the time in the world; there is no reason to look like a crawler.
  per_host_min_interval: 2.0
  respect_robots: true
  out_dir: "../public-data"
  history_retention_days: 400

incois:
  base_url: "https://incois.gov.in/MarineFisheries/"
  home_path: "TextDataHome?mfid=1&request_locale=en"
  sector_path: "TextData?secid={secid}"
  # Sectors to fetch each day, in order. All 14 are known (see meenvazhi/incois.py);
  # these are the ones relevant to a boat working out of Kochi.
  # Fetched one by one after opening TextDataHome, in this order, which is also
  # the order the app lists the areas in.
  sectors:
    - SEC006   # SOUTH TAMILNADU
    - SEC007   # NORTH TAMILNADU
    - SEC005   # KERALA
    - SEC004   # KARNATAKA
    - SEC003   # GOA
    # SEC014 LAKSHADWEEP was fetched until 29 Sep 2026; add it back here to restore it.

output:
  home_port: kochi
  # Zones beyond this range from the home port are still published, but flagged
  # unreachable so the app can filter them out by default.
  reachable_nmi: 120
