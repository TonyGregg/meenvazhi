# Tool configuration only. The pipeline is run as a script, not installed as a package.

[tool.ruff]
line-length = 120          # matches the existing style in ../bloom
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PTH", "DTZ", "RUF"]
# DTZ is deliberate: this project must never build a naive datetime. Advisory
# dates are Asia/Kolkata and run timestamps are UTC, and conflating them
# silently mislabels which day an advisory belongs to.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["meenvazhi", "run_pipeline.py"]

[[tool.mypy.overrides]]
module = ["geographiclib.*", "bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=meenvazhi --cov-fail-under=90"
filterwarnings = ["error"]
