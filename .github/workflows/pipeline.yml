name: Daily PFZ pipeline

# Runs every two hours from 10:00 to 22:00 India time.
#
# One run a day proved fragile. GitHub's scheduler delayed the first two scheduled
# runs by six and seven hours, which pushed the day's advisory past midnight India
# time, possibly after a boat had already left. With seven chances a day, a few
# delayed runs no longer matter.
#
# The extra runs cost INCOIS almost nothing:
#   - A scheduled run stops before making any request once today's advisory is
#     already published (the guard step below).
#   - Before INCOIS posts the day's update, a run fetches the same advisory as
#     last time. The pipeline recognises it as unchanged and writes nothing, so
#     there is nothing to commit and nothing to deploy.
# Each run that does reach INCOIS makes six sequential requests: the Text Data
# landing page, which opens the session and carries the forecast dates, then one
# per sector, at least two seconds apart.
on:
  schedule:
    - cron: "30 4 * * *"    # 10:00 IST
    - cron: "30 6 * * *"    # 12:00 IST
    - cron: "30 8 * * *"    # 14:00 IST
    - cron: "30 10 * * *"   # 16:00 IST, just after the 15:26 IST update seen on 27 Sep
    - cron: "30 12 * * *"   # 18:00 IST
    - cron: "30 14 * * *"   # 20:00 IST
    - cron: "30 16 * * *"   # 22:00 IST
  workflow_dispatch:
    inputs:
      sectors:
        description: "Comma-separated sector ids (blank uses config.yaml)"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two runs write public-data at once, and never cancel one midway.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.run.outputs.published }}
    steps:
      - uses: actions/checkout@v7

      - name: Skip if today's advisory is already published
        id: guard
        # Guards every scheduled run. A manual dispatch always runs.
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          today="$(TZ=Asia/Kolkata date +%F)"
          if [ -f public-data/status.json ] && \
             jq -e --arg d "$today" '.published == true and .advisory_date == $d' public-data/status.json >/dev/null; then
            echo "today's advisory ($today) is already published; not contacting INCOIS again"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.guard.outputs.skip != 'true'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        working-directory: pipeline
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Fetch advisories
        id: run
        if: steps.guard.outputs.skip != 'true'
        working-directory: pipeline
        run: |
          set +e
          .venv/bin/python run_pipeline.py \
            ${{ inputs.sectors && format('--sectors {0}', inputs.sectors) || '' }} \
            --save-html runs/ -v | tee summary.json
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "published=$(jq -r '.published' summary.json)" >> "$GITHUB_OUTPUT"
          # INCOIS's own date for the advisory, which is not necessarily today in
          # IST: a run just after midnight IST still carries the previous day's
          # advisory until INCOIS issues the next one. An all-cloudy day has no
          # date at all, because the timestamp only appears on populated pages.
          echo "advisory_date=$(jq -r '.advisory_date // empty' summary.json)" >> "$GITHUB_OUTPUT"
          # Exit 3 means a sector could not be fetched and previously published
          # data was deliberately left untouched. That is the pipeline working as
          # designed on a bad day, so surface it without failing the workflow;
          # anything else is a real fault.
          if [ "$code" -eq 3 ]; then
            echo "::warning::Nothing published; the previous advisory is still live. See status.json."
            exit 0
          fi
          exit "$code"

      - name: Upload fetched HTML
        # Kept for 14 days rather than committed: 50 KB per sector per day adds up,
        # and this is only ever needed to debug a parse failure. Without it, an
        # INCOIS redesign costs a day of guessing.
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: incois-html-${{ github.run_id }}
          path: pipeline/runs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit the advisory
        if: steps.run.outputs.published == 'true'
        run: |
          git config user.name "meenvazhi-bot"
          git config user.email "noreply@github.com"
          git add public-data
          if git diff --cached --quiet; then
            echo "no change in public-data; nothing to commit"
            exit 0
          fi
          # The git log is the audit trail of what INCOIS said on each day, so the
          # message must name the advisory's date, not the date we happened to run.
          date="${{ steps.run.outputs.advisory_date }}"
          if [ -n "$date" ]; then
            git commit -m "data: PFZ advisory $date"
          else
            git commit -m "data: no advisory, all sectors cloud-covered ($(TZ=Asia/Kolkata date +%F) IST)"
          fi
          # Retry once against a moving remote rather than failing the day's run.
          git push || { git pull --rebase --autostash && git push; }

  deploy:
    needs: fetch
    if: needs.fetch.outputs.published == 'true'
    # Called directly rather than relying on the data commit to trigger pages.yml:
    # a push made with the default GITHUB_TOKEN does not trigger other workflows,
    # so a push-triggered deploy would never fire and the site would serve stale
    # JSON indefinitely.
    uses: ./.github/workflows/pages.yml
