name: Deploy to GitHub Pages

on:
  # Invoked by pipeline.yml after a successful data commit. See the note there:
  # a GITHUB_TOKEN push cannot trigger a workflow, so this must be callable.
  workflow_call:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "public-data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the branch tip, not the SHA that triggered this run.
          #
          # When pipeline.yml calls this workflow, it has already committed the
          # day's advisory, but that commit did not exist when the run started.
          # The default checkout uses the triggering SHA, so it would publish the
          # data as it was BEFORE the fetch, and the site would serve yesterday's
          # advisory indefinitely. That is the exact failure the workflow_call
          # arrangement exists to prevent, and the trigger was only half of it.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Assemble the site
        # The app and its data are served from one origin, so there is no CORS to
        # configure, one cache to reason about, and a much simpler service worker.
        run: |
          rm -rf dist
          cp -R web/dist dist
          mkdir -p dist/data
          cp -R public-data/. dist/data/

      - name: Report what is being published
        # So the run log records the advisory actually deployed. Without this, a
        # stale deploy looks identical to a fresh one.
        run: |
          echo "commit:       $(git rev-parse --short HEAD) $(git log -1 --format=%s)"
          echo "advisory_date: $(jq -r '.advisory_date' dist/data/pfz-latest.json)"
          echo "generated_at:  $(jq -r '.generated_at' dist/data/pfz-latest.json)"
          echo "zones:         $(jq -r '.counts.zones' dist/data/pfz-latest.json)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
